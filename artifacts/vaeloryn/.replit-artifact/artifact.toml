kind = "web"
previewPath = "/"
title = "Vaeloryn"
version = "1.0.0"
id = "artifacts/vaeloryn"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25783

[services.development]
run = "pnpm --filter @workspace/vaeloryn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vaeloryn", "run", "build" ]
serve = "static"
publicDir = "artifacts/vaeloryn/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25783"
BASE_PATH = "/"
