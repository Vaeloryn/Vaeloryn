kind = "slides"
previewPath = "/vaeloryn-fjord-pitch-deck/"
title = "Vaeloryn — Investor & Base Ecosystem Fund Pitch Deck"
description = "A 12-slide pre-seed investor presentation positioning Vaeloryn as an onchain ecosystem connecting capital with scientific, medical and technological innovation, with Base as its intended production home."
version = "1.0.0"
id = "artifacts/vaeloryn-fjord-pitch-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/vaeloryn-fjord-pitch-deck/" ]
localPort = 22298

[services.development]
run = "pnpm --filter @workspace/vaeloryn-fjord-pitch-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vaeloryn-fjord-pitch-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/vaeloryn-fjord-pitch-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22298"
BASE_PATH = "/vaeloryn-fjord-pitch-deck/"
